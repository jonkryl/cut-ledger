name: Android CI
on:
  push:
    branches: [main]
    paths-ignore: ['privacy/**', '*.md']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: cut-ledger-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Compile, independent cutting regression tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore original initial sources only for a new empty repository
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle.kts ]; then
            python3 - <<'PYCODE'
          import base64,gzip,hashlib,json
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(data).hexdigest()=="1769e8e12759639c1c1599cc9cefb95cf940daac9f9040691dcac1579ecd0ac2"
          for name,entry in json.loads(data).items():
              path=Path(name)
              assert not path.is_absolute() and ".." not in path.parts and ".github" not in path.parts
              content=base64.b64decode(entry["b64"])
              assert hashlib.sha256(content).hexdigest()==entry["sha256"]
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content);path.chmod(entry["mode"])
          PYCODE
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'Implement original finite-stock cutting utility and independent numeric and actual device checks'
            git push origin HEAD:main
          fi
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Compile once, independently verify finite cutting plans, lint, prepare APK pair
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Source and APK provenance
        run: |
          mkdir -p ci-artifacts
          printf 'source=%s\nrun=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > ci-artifacts/provenance.txt
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk > ci-artifacts/apk-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-lint-proof
          path: |
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            ci-artifacts/
          retention-days: 7
  device:
    name: Android API ${{ matrix.api }} real journey
    needs: build
    env:
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: debug-apks
          path: ci-apks
      - name: Free disk before emulator boot
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/ghc /usr/share/dotnet
          df -h
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools emulator'
          log-accepted-android-sdk-licenses: 'false'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048
          script: bash scripts/device-journey.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-api-${{ matrix.api }}
          path: ci-artifacts/
          retention-days: 7
          if-no-files-found: error
