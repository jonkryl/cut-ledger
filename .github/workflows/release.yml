name: Verified signed release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit which passed Android CI
        required: true
        default: 'dee21ba9f81f194a5bef2506096bc55f6c937cf5'
      ci_run_id:
        description: Successful Android CI run for this exact source
        required: true
        default: '37184314416'
      reuse_signed_run_id:
        description: Reuse this exact successful signing job's APK/AAB; blank for a new build
        required: false
        default: ''
      version_code:
        required: true
        default: '1'
      version_name:
        required: true
        default: '1.0.0'
permissions:
  contents: read
  actions: read
concurrency:
  group: cut-ledger-release
  cancel-in-progress: false
jobs:
  signed:
    name: Verify prior quality proof and sign APK/AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ inputs.source_ref }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      YANDEX_BANNER_ID: R-M-20171771-1
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
      - name: Validate inputs and restore public release verification helpers
        env:
          HELPER_PAYLOAD: 
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'HELPERS'
          import os,json,base64
          from pathlib import Path
          folder=Path('release-tools');folder.mkdir()
          for name,content in json.loads(base64.b64decode(os.environ['HELPER_PAYLOAD'])).items():
              assert name in {'verify-release.sh','release-metadata.py','quality-gate.py','verify-certificate.py'}
              (folder/name).write_text(content)
          HELPERS
      - name: Reuse successful quality checks for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > quality-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > quality-jobs.json
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name unit-lint-proof --dir quality-proof
          python3 release-tools/quality-gate.py
      - name: Reuse exact signed artifacts when only device checks need repair
        if: ${{ inputs.reuse_signed_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_SIGNED_RUN: ${{ inputs.reuse_signed_run_id }}
        run: |
          set -euo pipefail
          [[ "$REUSE_SIGNED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_SIGNED_RUN/jobs?per_page=100" > reused-jobs.json
          gh run download "$REUSE_SIGNED_RUN" --repo "$GITHUB_REPOSITORY" --name signed-release --dir reused
          python3 - <<'REUSE'
          import json,os,hashlib,shutil
          from pathlib import Path
          jobs=json.loads(Path('reused-jobs.json').read_text())['jobs']
          assert any(j['name']=='Verify prior quality proof and sign APK/AAB' and j['conclusion']=='success' for j in jobs)
          folder=Path('reused/release-output');r=json.loads((folder/'release-verification.json').read_text())
          assert r['package']=='com.jonkryl.cutledger' and r['sourceSha']==os.environ['SOURCE_SHA']
          assert r['versionCode']==int(os.environ['VERSION_CODE']) and r['versionName']==os.environ['VERSION_NAME']
          assert r['bannerId']==os.environ['YANDEX_BANNER_ID']
          assert r['certificateSha256']=='5f10d6584f0ee762cffd0f500a0dde0111932a4dd42c20ae9d1365a21e8c1be9'
          for artifact in r['artifacts']:
              file=folder/artifact['filename'];assert file.parent==folder
              assert hashlib.sha256(file.read_bytes()).hexdigest()==artifact['sha256']
          shutil.copytree(folder,'release-output')
          Path('release-output/reuse-receipt.json').write_text(json.dumps({'reusedSignedRun':int(os.environ['REUSE_SIGNED_RUN']),'sameSourceSha':os.environ['SOURCE_SHA'],'sameVerifiedBinaryHashes':True}))
          REUSE
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        if: ${{ inputs.reuse_signed_run_id == '' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Load protected own upload key
        if: ${{ inputs.reuse_signed_run_id == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf 'KEYSTORE_FILE=%s/cut-ledger-upload.p12\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cut-ledger-upload.p12"
      - name: Build minified signed release and Play bundle
        if: ${{ inputs.reuse_signed_run_id == '' }}
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleRelease :app:bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Verify signatures, real banner, manifest, bundle and 16 KB alignment
        if: ${{ inputs.reuse_signed_run_id == '' }}
        run: |
          bash release-tools/verify-release.sh
          cp quality-run.json quality-jobs.json release-output/
          cp quality-proof/ci-artifacts/provenance.txt release-output/quality-source.txt
      - name: Independently reverify reused APK signature
        if: ${{ inputs.reuse_signed_run_id != '' }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs release-output/*.apk > reused-certificate.txt
          grep -q 'certificate SHA-256 digest: 5f10d6584f0ee762cffd0f500a0dde0111932a4dd42c20ae9d1365a21e8c1be9' reused-certificate.txt
          cp reused-certificate.txt release-output/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release
          path: |
            release-output/
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.*
          if-no-files-found: error
          retention-days: 7
      - name: Remove ephemeral key
        if: always()
        run: rm -f "$RUNNER_TEMP/cut-ledger-upload.p12"
  release-device:
    name: Actual signed release API ${{ matrix.api }} (${{ matrix.target }})
    needs: signed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ inputs.source_ref }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            target: google_apis
          - api: 36
            target: google_apis_ps16k
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release
          path: release-files
      - name: Restore original public release smoke and screenshot script
        env:
          SMOKE_BASE64: 
        run: printf '%s' "$SMOKE_BASE64" | base64 --decode > release-smoke.py
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools emulator'
          log-accepted-android-sdk-licenses: 'false'
      - name: Free disk and enable KVM
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/ghc /usr/share/dotnet
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048
          script: python3 release-smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-device-api-${{ matrix.api }}
          path: release-device/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish verified downloadable release after actual device checks
    needs: [signed, release-device]
    uses: ./.github/workflows/publish-artifacts.yml
    permissions:
      contents: write
      actions: read
    with:
      checked_run_id: ${{ github.run_id }}
